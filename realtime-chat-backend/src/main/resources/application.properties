spring.application.name=realtime-chat

# Database configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/chatdb}
spring.datasource.username=${DATABASE_USERNAME:chatuser}
spring.datasource.password=${DATABASE_PASSWORD:chatpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis configuration
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

# Server configuration
server.port=${PORT:8080}

# JWT
jwt.secret=${JWT_SECRET:change-me-in-production-use-at-least-32-chars!!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Multipart upload (25 MB plaintext + Tink overhead + multipart envelope)
spring.servlet.multipart.max-file-size=26MB
spring.servlet.multipart.max-request-size=27MB

# Storage Configuration (Cloudflare R2, AWS S3, or S3-compatible provider)
# If left blank, the server automatically defaults to local filesystem storage at ./uploads

# Option A: Cloudflare R2
r2.account-id=${R2_ACCOUNT_ID:}
r2.access-key=${R2_ACCESS_KEY:${AWS_ACCESS_KEY_ID:}}
r2.secret-key=${R2_SECRET_KEY:${AWS_SECRET_ACCESS_KEY:}}
r2.bucket=${R2_BUCKET:${AWS_S3_BUCKET:chat-files}}
r2.public-url-ttl-seconds=${R2_URL_TTL:3600}

# Option B: AWS S3 / Custom S3 provider (optional)
s3.endpoint=${S3_ENDPOINT:}
s3.region=${AWS_REGION:us-east-1}

